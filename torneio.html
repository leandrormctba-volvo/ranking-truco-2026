<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneio dos Campeões – Truco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pet1:#0e6a7a; --pet2:#0a4f5c; --pet3:#05303a; --petclaro:#a9d4da;
    --ouro:#f2c14e; --ouro2:#c9932a; --papel:#fbf7ee; --prata:#d6dde3; --prata2:#9aa6b0; --vermelho:#d64545;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#04242b; font-family:Inter,system-ui,sans-serif; color:#fff; min-height:100vh}
  .wrap{max-width:1180px; margin:0 auto; padding:24px 16px 40px}

  .btn-pdf{all:unset; cursor:pointer; position:fixed; right:18px; bottom:18px; z-index:5; display:inline-flex; align-items:center; gap:8px;
    padding:12px 18px; border-radius:999px; background:var(--papel); color:#053039; font-weight:700; font-size:14px;
    box-shadow:0 10px 26px rgba(0,0,0,.45); transition:transform .15s ease}
  .btn-pdf:hover{transform:translateY(-2px)}
  .btn-pdf:focus-visible{outline:2px solid var(--ouro); outline-offset:2px}
  .btn-pdf svg{color:var(--pet2)}

  .arte{
    position:relative; overflow:hidden; text-align:center; border-radius:26px; padding:40px 28px 34px;
    background:
      radial-gradient(700px 340px at 50% 0%, rgba(120,210,222,.22), transparent 65%),
      radial-gradient(500px 260px at 50% 100%, rgba(242,193,78,.10), transparent 70%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 1px, transparent 1px 9px),
      linear-gradient(180deg, var(--pet1) 0%, var(--pet2) 45%, var(--pet3) 100%);
    border:2px solid var(--ouro2);
    box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 0 0 8px rgba(0,0,0,.15), inset 0 0 0 10px rgba(242,193,78,.35);
  }
  .logo{display:block; margin:0 auto; width:min(230px,55vw); height:auto}
  .sep{display:flex; align-items:center; justify-content:center; gap:12px; margin:18px 0 6px; font-size:16px; letter-spacing:6px; color:#e9f3f4}
  .sep .r{color:var(--vermelho)}
  .sep::before,.sep::after{content:""; height:1px; width:min(16vw,120px); background:linear-gradient(90deg,transparent,rgba(255,255,255,.45))}
  .sep::after{transform:scaleX(-1)}
  .titulo{font-family:"Bebas Neue",sans-serif; font-weight:400; font-size:clamp(48px,9vw,100px); line-height:.9; margin:0; letter-spacing:1px; color:#fff}
  .titulo span{display:block; padding-top:.12em; margin-top:-.12em; background:linear-gradient(180deg,#ffe7a0,var(--ouro) 50%,var(--ouro2)); -webkit-background-clip:text; background-clip:text; color:transparent}

  .info{display:flex; justify-content:center; align-items:stretch; gap:12px; flex-wrap:wrap; margin-top:22px}
  .data{display:inline-flex; align-items:center; gap:10px; padding:8px 18px 8px 14px; border-radius:16px; background:var(--papel); color:var(--pet2); box-shadow:0 10px 24px rgba(0,0,0,.3)}
  .data b{font-family:"Bebas Neue"; font-weight:400; font-size:46px; line-height:.9}
  .data span{font-family:"Bebas Neue"; font-size:20px; line-height:.95; text-align:left}
  .data i{font-style:normal; font-weight:800; font-size:13px; letter-spacing:2px; text-transform:uppercase; border-left:2px solid #d7dfe1; padding-left:10px; color:#1b1b1b}
  .item{display:flex; flex-direction:column; justify-content:center; text-align:left; padding:8px 16px; border-radius:16px; background:rgba(2,30,36,.45); border:1px solid rgba(242,193,78,.45)}
  .item small{font-size:10.5px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:var(--ouro)}
  .item b{font-size:16px; line-height:1.2}
  .item.hora b{font-family:"Bebas Neue"; font-weight:400; font-size:38px; line-height:.95}
  .confirma{display:inline-block; margin-top:14px; padding:8px 18px; border-radius:999px; background:linear-gradient(120deg,#ffe7a0,var(--ouro)); color:#053039; font-size:14px; font-weight:600; box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .confirma b{font-weight:800}
  a.confirma{text-decoration:none; transition:transform .15s ease}
  a.confirma:hover{transform:translateY(-2px)}
  a.confirma::after{content:"  ›  Confirmar"; font-weight:800; background:#053039; color:#ffe7a0; padding:3px 10px; border-radius:999px; margin-left:8px; font-size:12px; white-space:pre}
  @media print{ a.confirma::after{content:none} }

  .sub{margin:28px 0 16px; font-family:"Bebas Neue"; font-size:30px; letter-spacing:3px; color:var(--ouro); display:flex; align-items:center; gap:14px; justify-content:center}
  .sub::before,.sub::after{content:""; height:2px; width:min(18vw,140px); background:linear-gradient(90deg,transparent,var(--ouro))}
  .sub::after{transform:scaleX(-1)}

  .grade{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; text-align:left}
  .vaga{position:relative; background:var(--papel); color:#1b1b1b; border-radius:14px; padding:16px 12px 12px; min-height:150px;
    box-shadow:0 12px 26px rgba(0,0,0,.35); display:flex; flex-direction:column; overflow:hidden}
  .vaga::before{content:""; position:absolute; left:0; right:0; top:0; height:5px; background:linear-gradient(90deg,var(--pet2),#16899b)}
  .vaga.herdada::before{background:linear-gradient(90deg,#7d8a93,#c5cdd3)}
  .vaga .num{position:absolute; top:10px; right:10px; font-family:"Bebas Neue"; font-size:34px; line-height:1; color:rgba(10,79,92,.14)}
  .vaga .de{font-size:10.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--pet2); display:flex; align-items:center; gap:6px}
  .vaga .de .naipe{font-size:15px}
  .vermelho{color:var(--vermelho)!important}
  .vaga .nm{font-weight:800; font-size:15px; line-height:1.3; margin-top:8px; flex:1}
  .vaga .tag{align-self:flex-start; margin-top:10px; font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:999px; letter-spacing:.5px}
  .vaga .tag.camp{background:linear-gradient(120deg,#ffe7a0,var(--ouro)); color:#2a1d00}
  .vaga .tag.vice{background:linear-gradient(120deg,#fff,var(--prata)); color:#2b333a; border:1px solid #c5cdd3}
  .vaga .obs{font-size:10.5px; color:#5d6973; margin-top:6px; line-height:1.3}
  .vaga .alerta{font-size:10px; color:#b23a3a; font-weight:600; margin-top:4px}

  @media (max-width:1000px){ .grade{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:520px){
    .wrap{padding:16px 12px 90px}
    .arte{padding:28px 14px 22px; border-radius:20px}
    .grade{gap:10px}
    .vaga{min-height:130px; padding:14px 10px 10px} .vaga .nm{font-size:13.5px}
    .sub{font-size:24px; gap:8px} .sub::before,.sub::after{width:28px}
    .confirma{font-size:13px}
  }

  /* ---------- PDF / impressão: uma folha A4 ---------- */
  @page{size:A4 portrait; margin:10mm}
  @media print{
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    html,body{background:#fff!important}
    .wrap{max-width:none; padding:0}
    .btn-pdf{display:none!important}
    .arte{box-shadow:none; border-radius:16px; padding:20px 18px 16px; min-height:276mm; display:flex; flex-direction:column; justify-content:center; break-inside:avoid}
    .logo{width:170px}
    .sep{margin:12px 0 4px; font-size:13px}
    .titulo{font-size:56pt}
    .info{margin-top:14px}
    .data{box-shadow:none; padding:5px 14px 5px 12px} .data b{font-size:38px}
    .item{padding:5px 12px} .item.hora b{font-size:32px}
    .confirma{align-self:center; margin-top:10px; font-size:10.5pt; padding:6px 16px; box-shadow:none}
    .sub{margin:16px 0 10px; font-size:21pt}
    .grade{grid-template-columns:repeat(2,1fr)!important; gap:8px}
    .vaga{min-height:0; box-shadow:none; padding:10px 12px 9px; break-inside:avoid}
    .vaga .num{font-size:26px; top:7px}
    .vaga .de{font-size:7.5pt}
    .vaga .nm{font-size:11pt; margin-top:3px; line-height:1.25}
    .vaga .tag{margin-top:5px; font-size:7.5pt; padding:2px 8px}
    .vaga .obs{font-size:7pt; margin-top:3px}
  }
</style>
</head>
<body>
<div class="wrap">
  <main class="arte">
    <img class="logo" src="logo-av-branca.png" alt="Associação Volvo">
    <div class="sep" aria-hidden="true">♠ <span class="r">♥</span> ♣ <span class="r">♦</span></div>
    <h1 class="titulo">Torneio dos <span>Campeões</span></h1>

    <div class="info">
      <div class="data"><b>29</b><span>NOV<br>2026</span><i>Domingo</i></div>
      <div class="item hora"><small>Horário</small><b>11h</b></div>
      <div class="item"><small>Local</small><b>Salão de Jogos<br>Espaço Soccer</b></div>
    </div>
    <a class="confirma" href="confirmacao.html">✋ Confirme sua participação até <b>quinta-feira, 26/11</b></a>

    <div class="sub">Duplas classificadas</div>
    <div class="grade" id="classificados"></div>
  </main>
</div>

<button class="btn-pdf" id="btnPdf" type="button" aria-label="Baixar em PDF">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6"/><path d="m9 14 3 3 3-3"/>
  </svg>
  Baixar PDF
</button>

<script src="dados.js"></script>
<script>
(function(){
  const NAIPES = [['♠',0],['♥',1],['♣',0],['♦',1]];
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const dados = window.RANKING;
  const N = dados[0].etapas.length;

  // Regra: entra a dupla campeã (22) de cada etapa; se ela já estava
  // classificada por uma etapa anterior, a vaga vai para a vice (20).
  const ja = new Map();
  const vagas = [];
  for(let i=0;i<N;i++){
    const camp = dados.filter(p => p.etapas[i]===22).map(p=>p.nome);
    const vice = dados.filter(p => p.etapas[i]===20).map(p=>p.nome);
    const repetida = camp.length && camp.every(n => ja.has(n));
    const v = repetida ? {etapa:i+1, nomes:vice, tipo:'vice', origem:ja.get(camp[0])}
                       : {etapa:i+1, nomes:camp, tipo:'camp'};
    v.nomes.forEach(n => { if(!ja.has(n)) ja.set(n, i+1); });
    vagas.push(v);
  }

  document.getElementById('classificados').innerHTML = vagas.map((v,i) => {
    const [s,r] = NAIPES[(v.etapa-1)%4];
    const pts = v.tipo==='camp' ? 22 : 20;
    const aviso = v.nomes.length !== 2
      ? `<div class="alerta">⚠ ${v.nomes.length} jogadores com ${pts} pts nesta etapa</div>` : '';
    return `<article class="vaga ${v.tipo==='vice'?'herdada':''}">
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <div class="de"><span class="naipe ${r?'vermelho':''}">${s}</span>Vaga da ${v.etapa}ª etapa</div>
      <div class="nm">${v.nomes.map(esc).join('<br>')}</div>
      ${aviso}
      <span class="tag ${v.tipo}">${v.tipo==='camp' ? '🏆 Campeã · 22 pts' : '🥈 Vice · 20 pts'}</span>
      ${v.tipo==='vice' ? `<div class="obs">Campeões desta etapa já classificados na ${v.origem}ª etapa</div>` : ''}
    </article>`;
  }).join('');

  document.getElementById('btnPdf').addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
