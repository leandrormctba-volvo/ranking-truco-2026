<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking de Truco AV 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --feltro:#0a4a56; --feltro2:#062b34; --feltro3:#0f5a69;
    --papel:#fbf7ee; --tinta:#1b1b1b; --suave:#9cc7ce; --linha:rgba(255,255,255,.08);
    --ouro:#f2c14e; --ouro2:#c9932a; --prata:#d6dde3; --prata2:#9aa6b0; --bronze:#d9925b;
    --vermelho:#d64545; --texto:#eef5f1;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #12697a 0%, transparent 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
      var(--feltro2);
    color:var(--texto); font-family:Inter,system-ui,sans-serif; min-height:100vh;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:24px 16px 60px}
  header{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
  .marca{display:flex; align-items:center; gap:14px}
  .naipes{font-size:28px; letter-spacing:2px; line-height:1}
  .naipes .r{color:var(--vermelho)}
  h1{font-family:"Bebas Neue",sans-serif; font-weight:400; font-size:clamp(34px,5vw,54px); letter-spacing:1px; margin:0; line-height:.95}
  h1 span{color:var(--ouro)}
  .sub{color:var(--suave); font-size:14px; margin-top:4px}
  .abas{display:flex; background:rgba(0,0,0,.28); border:1px solid var(--linha); border-radius:999px; padding:4px}
  .abas button{all:unset; cursor:pointer; padding:10px 18px; border-radius:999px; font-weight:600; font-size:14px; color:var(--suave); white-space:nowrap}
  .abas button[aria-selected="true"]{background:var(--ouro); color:#2a1d00}
  .abas .link-torneio{text-decoration:none; padding:10px 18px; border-radius:999px; font-weight:600; font-size:14px; color:var(--ouro); white-space:nowrap; display:inline-flex; align-items:center; gap:4px}
  .abas .link-torneio:hover{background:rgba(242,193,78,.12)}
  .abas button:focus-visible{outline:2px solid var(--ouro); outline-offset:2px}
  .tela{display:none; animation:entra .45s ease}
  .tela.ativa{display:block}
  @keyframes entra{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

  /* ---------- PÓDIO EM CARTAS ---------- */
  .podio{display:grid; grid-template-columns:1fr 1.15fr 1fr; align-items:end; gap:22px; margin:34px auto 10px; max-width:860px}
  .carta{
    position:relative; background:var(--papel); color:var(--tinta); border-radius:16px; padding:22px 18px 20px;
    box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 0 6px #fff, inset 0 0 0 7px rgba(0,0,0,.08);
    text-align:center; transition:transform .3s ease;
  }
  .carta:hover{transform:translateY(-6px) rotate(0deg)!important}
  .carta.p2{transform:rotate(-4deg)} .carta.p3{transform:rotate(4deg)}
  .carta.p1{padding-top:34px; padding-bottom:30px}
  .canto{position:absolute; font-family:"Bebas Neue"; font-size:26px; line-height:.85; text-align:center}
  .canto small{display:block; font-family:Inter; font-size:18px}
  .canto.tl{top:12px; left:14px} .canto.br{bottom:12px; right:14px; transform:rotate(180deg)}
  .vermelho{color:var(--vermelho)}
  .selo{display:inline-grid; place-items:center; width:64px; height:64px; border-radius:50%; font-family:"Bebas Neue"; font-size:30px; margin-bottom:10px; color:#2a1d00}
  .p1 .selo{background:radial-gradient(circle at 35% 30%, #ffe7a0, var(--ouro) 55%, var(--ouro2)); width:78px; height:78px; font-size:38px}
  .p2 .selo{background:radial-gradient(circle at 35% 30%, #fff, var(--prata) 55%, var(--prata2))}
  .p3 .selo{background:radial-gradient(circle at 35% 30%, #ffd2ad, var(--bronze) 55%, #a7653a)}
  .carta .nomes{font-weight:800; font-size:16px; line-height:1.3}
  .p1 .nomes{font-size:19px}
  .carta .pts{font-family:"Bebas Neue"; font-size:44px; line-height:1; margin-top:10px}
  .p1 .pts{font-size:60px; color:#8a5a00}
  .carta .pts small{font-family:Inter; font-size:12px; font-weight:600; color:#777; letter-spacing:1px; display:block}

  /* ---------- NÚMEROS ---------- */
  .numeros{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:34px 0 22px}
  .num{background:rgba(0,0,0,.22); border:1px solid var(--linha); border-radius:14px; padding:14px 16px}
  .num b{display:block; font-family:"Bebas Neue"; font-size:34px; font-weight:400; color:var(--ouro); line-height:1}
  .num span{font-size:13px; color:var(--suave)}

  /* ---------- LISTA ---------- */
  .barra{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:12px}
  .busca{flex:1; min-width:220px; max-width:380px; background:rgba(0,0,0,.3); border:1px solid var(--linha); color:var(--texto); border-radius:12px; padding:12px 14px; font:inherit; font-size:15px}
  .busca::placeholder{color:#86b3ba}
  .legenda{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--suave); align-items:center}
  .legenda i{display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-3px; margin-right:5px}
  .lista{background:rgba(0,0,0,.18); border:1px solid var(--linha); border-radius:16px; overflow:hidden}
  .cab, .linha{display:grid; grid-template-columns:62px minmax(160px,1.3fr) 2fr 86px; gap:14px; align-items:center; padding:10px 16px}
  .cab{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--suave); background:rgba(0,0,0,.25)}
  .cab .etq{display:grid; grid-template-columns:repeat(10,1fr); gap:4px; text-align:center}
  .linha{border-top:1px solid var(--linha)}
  .linha:hover{background:rgba(255,255,255,.035)}
  .pos{font-family:"Bebas Neue"; font-size:26px; color:var(--suave); text-align:center; line-height:1}
  .linha.top .pos{color:var(--ouro)}
  .linha.empate .pos{opacity:.0}
  .quem{min-width:0}
  .quem .n{font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .quem .trofeus{font-size:12px; color:var(--ouro); margin-top:2px}
  .tira{display:grid; grid-template-columns:repeat(10,1fr); gap:4px}
  .c{height:28px; border-radius:6px; display:grid; place-items:center; font-size:12px; font-weight:700; color:#04232a}
  .c.v0{background:transparent; border:1px dashed rgba(255,255,255,.14); color:transparent}
  .c.v1{background:#1f5f6b; color:#d3ecef}
  .c.v2{background:#3f93a0; color:#04232a}
  .c.v3{background:#8fd0d8}
  .c.vice{background:linear-gradient(160deg,#fff,var(--prata2))}
  .c.camp{background:linear-gradient(160deg,#ffe7a0,var(--ouro2)); box-shadow:0 0 12px rgba(242,193,78,.45)}
  .tot{text-align:right}
  .tot b{font-family:"Bebas Neue"; font-weight:400; font-size:30px; line-height:1}
  .tot .mini{height:4px; background:rgba(255,255,255,.08); border-radius:4px; margin-top:4px; overflow:hidden}
  .tot .mini i{display:block; height:100%; background:var(--ouro)}
  .vazio{padding:30px; text-align:center; color:var(--suave)}

  /* ---------- TELA 2: ETAPAS ---------- */
  .intro2{margin:30px 0 20px; color:var(--suave); font-size:15px}
  .intro2 b{color:var(--texto)}
  .etapas{display:grid; grid-template-columns:repeat(2,1fr); gap:18px}
  .etapa .par{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .etapa .par .dupla{margin-top:0}
  @media (max-width:980px){ .etapas{grid-template-columns:1fr} }
  @media (max-width:520px){ .etapa .par{grid-template-columns:1fr} }
  .etapa{position:relative; background:var(--papel); color:var(--tinta); border-radius:18px; padding:18px 18px 16px;
    box-shadow:0 14px 30px rgba(0,0,0,.4), inset 0 0 0 5px #fff, inset 0 0 0 6px rgba(0,0,0,.07); overflow:hidden}
  .etapa .marca-agua{position:absolute; right:-6px; bottom:-28px; font-size:130px; opacity:.06; line-height:1; pointer-events:none}
  .etapa h3{margin:0 0 12px; font-family:"Bebas Neue"; font-weight:400; font-size:30px; letter-spacing:.5px; display:flex; align-items:baseline; gap:8px}
  .etapa h3 .naipe{font-size:22px}
  .dupla{display:grid; grid-template-columns:52px 1fr; gap:12px; align-items:center; padding:10px; border-radius:12px; margin-top:8px}
  .dupla.camp{background:linear-gradient(120deg,#fff4d2,#fde7a6)}
  .dupla.vice{background:linear-gradient(120deg,#f3f5f7,#e1e6ea)}
  .dupla .medalha{width:52px; height:52px; border-radius:50%; display:grid; place-items:center; font-family:"Bebas Neue"; font-size:24px; line-height:1; text-align:center}
  .dupla .medalha small{display:block; font-family:Inter; font-size:9px; font-weight:700; letter-spacing:.5px}
  .camp .medalha{background:radial-gradient(circle at 35% 30%, #ffe7a0, var(--ouro) 55%, var(--ouro2)); color:#2a1d00}
  .vice .medalha{background:radial-gradient(circle at 35% 30%, #fff, var(--prata) 55%, var(--prata2)); color:#2b333a}
  .dupla .tit{font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#8a6a1c}
  .vice .tit{color:#5d6973}
  .dupla .nm{font-weight:700; font-size:15px; line-height:1.35}
  .alerta{margin-top:6px; font-size:11px; font-weight:600; color:#b23a3a}
  .hall{margin-top:36px}
  .hall h2{font-family:"Bebas Neue"; font-weight:400; font-size:32px; margin:0 0 12px}
  .hall .grade{display:flex; flex-wrap:wrap; gap:10px}
  .chip{background:rgba(0,0,0,.25); border:1px solid var(--linha); border-radius:999px; padding:8px 14px; font-size:14px}
  .chip b{color:var(--ouro); margin-right:6px}
  footer{margin-top:40px; font-size:12px; color:#7aa5ac; text-align:center}

  /* ---------- BOTÃO PDF ---------- */
  .acoes{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .btn-pdf{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px;
    background:var(--papel); color:#1b1b1b; font-weight:700; font-size:14px; box-shadow:0 6px 16px rgba(0,0,0,.35); transition:transform .15s ease}
  .btn-pdf:hover{transform:translateY(-2px)}
  .btn-pdf:focus-visible{outline:2px solid var(--ouro); outline-offset:2px}
  .btn-pdf svg{color:var(--vermelho)}
  .so-impressao{display:none}
  .abas .sm{display:none}
  @media (max-width:760px){
    .abas .lg{display:none} .abas .sm{display:inline}
    .abas button, .abas .link-torneio{font-size:13px; padding:10px 6px}
    .abas .link-torneio{flex:1; justify-content:center}
  }

  /* ---------- CELULAR ---------- */
  @media (max-width:760px){
    .podio{grid-template-columns:1fr; gap:16px; max-width:360px}
    .carta.p1{order:-1}
    .carta.p2,.carta.p3{transform:none}
    .numeros{grid-template-columns:repeat(2,1fr)}
    .cab{display:none}
    .linha{grid-template-columns:44px 1fr 64px; row-gap:8px}
    .linha .tira{grid-column:1 / -1; grid-row:2}
    .linha .tot{grid-column:3; grid-row:1}
    .c{height:24px; font-size:11px}
    .acoes{width:100%} .abas{flex:1} .abas button{flex:1; text-align:center; padding:10px 8px}
    .btn-pdf span{display:none} .btn-pdf{padding:10px 12px}
  }

  /* ---------- IMPRESSÃO / PDF (A4) ---------- */
  @page{size:A4 portrait; margin:12mm 10mm 14mm}
  @media print{
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    html,body{background:#fff!important; color:#1b1b1b}
    body{font-size:10pt}
    .wrap{max-width:none; padding:0}
    .acoes, .barra, footer{display:none!important}
    .so-impressao{display:block}
    .tela{display:block!important; animation:none}
    header{border-bottom:3px solid #0a4a56; padding-bottom:8px}
    .naipes{font-size:20px; color:#1b1b1b}
    h1{font-size:30pt; color:#0a4a56} h1 span{color:#b07d10}
    .sub{color:#555}
    .cab-impressao{font-size:8.5pt; color:#666; margin-top:4px; text-align:right}
    .titulo-impressao{font-family:"Bebas Neue",sans-serif; font-weight:400; font-size:22pt; color:#0a4a56; margin:10px 0 6px; letter-spacing:.5px}

    /* pódio */
    .podio{margin:6px auto 0; gap:14px; max-width:none; grid-template-columns:1fr 1.15fr 1fr!important}
    .carta, .carta.p2, .carta.p3{transform:none!important; box-shadow:none; border:1.5px solid #c9c2ae; padding:12px 10px}
    .carta.p1{padding:16px 10px; border-color:#c9932a; order:0!important}
    .selo{width:40px; height:40px; font-size:20px; margin-bottom:4px}
    .p1 .selo{width:48px; height:48px; font-size:24px}
    .carta .nomes{font-size:10pt} .p1 .nomes{font-size:11pt}
    .carta .pts{font-size:26pt; margin-top:4px} .p1 .pts{font-size:34pt}
    .canto{font-size:16px} .canto small{font-size:12px}

    /* números */
    .numeros{grid-template-columns:repeat(4,1fr)!important; gap:8px; margin:12px 0}
    .num{background:#f3f8f9; border:1px solid #d6e6e9; padding:8px 10px}
    .num b{font-size:20pt; color:#0a4a56} .num span{color:#555; font-size:8pt}

    /* lista */
    .lista{background:#fff; border:1px solid #cddfe2; border-radius:8px}
    .cab, .linha{grid-template-columns:34px minmax(0,1.25fr) 2fr 48px!important; gap:8px; padding:3px 8px}
    .cab{display:grid!important; background:#0a4a56; color:#fff; font-size:7pt; position:static}
    .cab .etq{display:grid}
    .linha{border-top:1px solid #e1eced; break-inside:avoid; page-break-inside:avoid}
    .linha:nth-child(even){background:#f6fafb}
    .linha .tira, .linha .tot{grid-column:auto; grid-row:auto}
    .pos{font-size:13pt; color:#666} .linha.top .pos{color:#b07d10}
    .quem .n{font-size:8.5pt; color:#1b1b1b}
    .quem .trofeus{font-size:6.5pt; color:#8a6a1c; margin-top:0}
    .tira{gap:2px}
    .c{height:15px; border-radius:3px; font-size:7pt}
    .c.v0{border-color:#c9dadd; color:#b0c4c8}
    .c.v1{background:#dcf0f2; color:#164a54}
    .c.v2{background:#ade0e6; color:#0e3a42}
    .c.v3{background:#6fc0ca; color:#072a31}
    .c.camp{box-shadow:none}
    .tot b{font-size:13pt; color:#0a4a56; line-height:1}
    .tot .mini{display:none}
    .pos{line-height:1}
    .quem .n{line-height:1.15}
    .quem .trofeus{line-height:1.1}
    .linha{min-height:0; padding-top:2px; padding-bottom:2px}
    .c{height:14px}

    /* tela 2 em página nova */
    #etapas{break-before:page; page-break-before:always}

    .intro2{color:#444; margin:0 0 10px; font-size:9.5pt} .intro2 b{color:#1b1b1b}
    .etapas{grid-template-columns:1fr 1fr!important; gap:10px}
    .etapa{box-shadow:none; border:1.5px solid #c9c2ae; padding:10px 12px; break-inside:avoid; page-break-inside:avoid}
    .etapa h3{font-size:16pt; margin-bottom:6px}
    .etapa .par{grid-template-columns:1fr 1fr!important; gap:6px}
    .dupla{grid-template-columns:34px 1fr; gap:6px; padding:6px}
    .dupla .medalha{width:34px; height:34px; font-size:15px}
    .dupla .medalha small{font-size:6pt}
    .dupla .tit{font-size:6.5pt} .dupla .nm{font-size:8.5pt}
    .alerta{font-size:6.5pt}
    .etapa .marca-agua{font-size:80px; bottom:-16px}
    .hall{margin-top:14px; break-inside:avoid}
    .hall h2{font-size:18pt; color:#0a4a56; margin-bottom:6px}
    .chip{background:#f3f8f9; border:1px solid #d6e6e9; color:#1b1b1b; font-size:8.5pt; padding:4px 10px}
    .chip b{color:#b07d10}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="marca">
      <div class="naipes" aria-hidden="true">♠<span class="r">♥</span>♣<span class="r">♦</span></div>
      <div>
        <h1>Ranking de Truco <span>AV 2026</span></h1>
        <div class="sub" id="sub"></div>
      </div>
    </div>
    <div class="acoes">
      <nav class="abas" role="tablist">
        <button role="tab" id="aba-ranking" aria-selected="true" data-tela="ranking">🏆 <span class="lg">Ranking geral</span><span class="sm">Ranking</span></button>
        <button role="tab" id="aba-etapas" aria-selected="false" data-tela="etapas">🃏 <span class="lg">Campeões das etapas</span><span class="sm">Etapas</span></button>
        <a class="link-torneio" href="torneio.html">👑 <span class="lg">Torneio dos Campeões</span><span class="sm">Torneio</span></a>
      </nav>
      <button class="btn-pdf" id="btnPdf" type="button" title="Baixar como PDF / Imprimir" aria-label="Baixar como PDF">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6"/><path d="m9 14 3 3 3-3"/>
        </svg>
        <span>PDF</span>
      </button>
    </div>
  </header>
  <div class="so-impressao cab-impressao" id="cabImpressao"></div>

  <!-- TELA 1 -->
  <section class="tela ativa" id="ranking" role="tabpanel">
    <h2 class="so-impressao titulo-impressao">Ranking geral</h2>
    <div class="podio" id="podio"></div>
    <div class="numeros" id="numeros"></div>
    <div class="barra">
      <input class="busca" id="busca" type="search" placeholder="Procurar jogador…" aria-label="Procurar jogador">
      <div class="legenda">
        <span><i style="background:linear-gradient(160deg,#ffe7a0,#c9932a)"></i>Campeão (22)</span>
        <span><i style="background:linear-gradient(160deg,#fff,#9aa6b0)"></i>Vice (20)</span>
        <span><i style="background:#8fd0d8"></i>14–18</span>
        <span><i style="background:#3f93a0"></i>8–12</span>
        <span><i style="background:#1f5f6b"></i>4–7</span>
        <span><i style="border:1px dashed rgba(255,255,255,.3)"></i>Não jogou</span>
      </div>
    </div>
    <div class="lista">
      <div class="cab"><div style="text-align:center">Pos.</div><div>Jogador</div><div class="etq" id="etq"></div><div style="text-align:right">Total</div></div>
      <div id="linhas"></div>
    </div>
  </section>

  <!-- TELA 2 -->
  <section class="tela" id="etapas" role="tabpanel">
    <h2 class="so-impressao titulo-impressao">Campeões das etapas</h2>
    <p class="intro2">Em cada etapa, a <b>dupla campeã</b> soma <b>22 pontos</b> e a <b>dupla vice</b> soma <b>20 pontos</b>.</p>
    <div class="etapas" id="cartasEtapas"></div>
    <div class="hall">
      <h2>Quem mais venceu etapas</h2>
      <div class="grade" id="hall"></div>
    </div>
  </section>


</div>

<script src="dados.js"></script>
<script>
(function(){
  const NAIPES = [['♠',0],['♥',1],['♣',0],['♦',1]];
  const dados = window.RANKING.map(p => ({
    nome: p.nome,
    etapas: p.etapas,
    total: p.etapas.reduce((s,v)=> s + (v||0), 0)
  }));
  const N_ETAPAS = dados[0].etapas.length;

  // Classificação: mesma pontuação = mesma posição (igual à planilha)
  dados.sort((a,b)=> b.total - a.total || a.nome.localeCompare(b.nome,'pt-BR'));
  let pos = 0, ultimo = null;
  dados.forEach(p => { if(p.total !== ultimo){ pos++; ultimo = p.total; } p.pos = pos; });
  dados.forEach(p => {
    p.titulos = p.etapas.filter(v => v===22).length;
    p.vices   = p.etapas.filter(v => v===20).length;
  });

  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const juntar = nomes => nomes.length <= 1 ? nomes.join('')
      : nomes.slice(0,-1).join(', ') + ' & ' + nomes[nomes.length-1];
  const lider = dados[0].total;

  document.getElementById('sub').textContent =
    `${N_ETAPAS} etapas disputadas · ${dados.length} jogadores`;

  // ---------- Pódio ----------
  const podio = document.getElementById('podio');
  const ordemVisual = [2,1,3];
  podio.innerHTML = ordemVisual.map(n => {
    const grupo = dados.filter(p => p.pos === n);
    if(!grupo.length) return '<div></div>';
    const [s,r] = NAIPES[n-1];
    const cls = r ? 'vermelho' : '';
    return `<article class="carta p${n}">
      <div class="canto tl ${cls}">${n}<small>${s}</small></div>
      <div class="canto br ${cls}">${n}<small>${s}</small></div>
      <div class="selo">${n}º</div>
      <div class="nomes">${grupo.map(p=>esc(p.nome)).join('<br>')}</div>
      <div class="pts">${grupo[0].total}<small>PONTOS</small></div>
    </article>`;
  }).join('');

  // ---------- Etapas (campeões e vices) ----------
  const etapas = [];
  for(let i=0;i<N_ETAPAS;i++){
    etapas.push({
      n: i+1,
      camp: dados.filter(p => p.etapas[i]===22).map(p=>p.nome),
      vice: dados.filter(p => p.etapas[i]===20).map(p=>p.nome)
    });
  }

  // ---------- Números ----------
  const maisEtapas = Math.max(...dados.map(p=>p.etapas.filter(v=>v!=null).length));
  const maxTit = Math.max(...dados.map(p=>p.titulos));
  const mediaPart = Math.round(etapas.reduce((s,_,i)=> s + dados.filter(p=>p.etapas[i]!=null).length, 0) / N_ETAPAS);
  document.getElementById('numeros').innerHTML = [
    [dados.length, 'jogadores no ranking'],
    [mediaPart, 'jogadores por etapa (média)'],
    [maxTit, 'títulos de etapa — recorde individual'],
    [lider - dados.find(p=>p.pos===2).total, 'pontos de vantagem do líder']
  ].map(([v,t]) => `<div class="num"><b>${v}</b><span>${t}</span></div>`).join('');

  // ---------- Lista ----------
  document.getElementById('etq').innerHTML =
    Array.from({length:N_ETAPAS},(_,i)=>`<span>${i+1}ª</span>`).join('');

  function classe(v){
    if(v==null) return 'v0';
    if(v===22) return 'camp';
    if(v===20) return 'vice';
    if(v>=14) return 'v3';
    if(v>=8)  return 'v2';
    return 'v1';
  }
  function desenhar(filtro){
    const f = (filtro||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
    const lista = dados.filter(p => !f || p.nome.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().includes(f));
    let anterior = null;
    document.getElementById('linhas').innerHTML = lista.length ? lista.map(p => {
      const empate = !f && p.pos === anterior; anterior = p.pos;
      const tr = [];
      if(p.titulos) tr.push('🏆'.repeat(p.titulos) + ` ${p.titulos} título${p.titulos>1?'s':''}`);
      if(p.vices) tr.push(`🥈 ${p.vices} vice${p.vices>1?'s':''}`);
      return `<div class="linha ${p.pos<=3?'top':''} ${empate?'empate':''}">
        <div class="pos">${p.pos}º</div>
        <div class="quem"><div class="n" title="${esc(p.nome)}">${esc(p.nome)}</div>${tr.length?`<div class="trofeus">${tr.join(' · ')}</div>`:''}</div>
        <div class="tira">${p.etapas.map((v,i)=>`<div class="c ${classe(v)}" title="${i+1}ª etapa: ${v==null?'não jogou':v+' pts'}">${v==null?'·':v}</div>`).join('')}</div>
        <div class="tot"><b>${p.total}</b><div class="mini"><i style="width:${(p.total/lider*100).toFixed(1)}%"></i></div></div>
      </div>`;
    }).join('') : '<div class="vazio">Nenhum jogador encontrado.</div>';
  }
  desenhar('');
  document.getElementById('busca').addEventListener('input', e => desenhar(e.target.value));

  // ---------- Tela 2 ----------
  const bloco = (tipo, nomes, pts) => {
    const titulo = tipo==='camp' ? 'Dupla campeã' : 'Dupla vice';
    const aviso = nomes.length !== 2
      ? `<div class="alerta">⚠ ${nomes.length} jogador(es) com ${pts} pts nesta etapa — conferir na planilha</div>` : '';
    return `<div class="dupla ${tipo}">
      <div class="medalha">${pts}<small>PTS</small></div>
      <div><div class="tit">${titulo}</div><div class="nm">${nomes.length? nomes.map(esc).join('<br>') : '—'}</div>${aviso}</div>
    </div>`;
  };
  document.getElementById('cartasEtapas').innerHTML = etapas.map(e => {
    const [s,r] = NAIPES[(e.n-1)%4];
    return `<article class="etapa">
      <div class="marca-agua ${r?'vermelho':''}">${s}</div>
      <h3><span class="naipe ${r?'vermelho':''}">${s}</span>${e.n}ª etapa</h3>
      <div class="par">${bloco('camp', e.camp, 22)}${bloco('vice', e.vice, 20)}</div>
    </article>`;
  }).join('');

  // Hall: duplas campeãs mais vezes
  const cont = {};
  etapas.forEach(e => { if(e.camp.length){ const k = juntar(e.camp); cont[k] = (cont[k]||0)+1; } });
  document.getElementById('hall').innerHTML = Object.entries(cont)
    .sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0],'pt-BR'))
    .map(([k,v]) => `<div class="chip"><b>${v}×</b>${esc(k)}</div>`).join('');

  // ---------- Troca de telas ----------
  const telas = ['ranking','etapas'];
  function mostrar(id){
    telas.forEach(t => {
      document.getElementById(t).classList.toggle('ativa', t===id);
      document.getElementById('aba-'+t).setAttribute('aria-selected', t===id);
    });
    if(location.hash !== '#'+id) history.replaceState(null,'','#'+id);
  }
  document.querySelectorAll('.abas button').forEach(b => b.addEventListener('click', () => mostrar(b.dataset.tela)));
  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    const atual = telas.findIndex(t => document.getElementById(t).classList.contains('ativa'));
    if(e.key === 'ArrowRight') mostrar(telas[(atual+1)%telas.length]);
    if(e.key === 'ArrowLeft')  mostrar(telas[(atual-1+telas.length)%telas.length]);
  });
  mostrar(telas.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'ranking');
  // abre sempre no topo (o #ranking/#etapas do endereço não deve rolar a página)
  window.addEventListener('load', () => setTimeout(() => window.scrollTo(0,0), 0));

  // ---------- PDF / impressão ----------
  const hoje = new Date();
  document.getElementById('cabImpressao').textContent =
    'Gerado em ' + hoje.toLocaleDateString('pt-BR') + ' · ' + location.href.split('#')[0];
  const buscaEl = document.getElementById('busca');
  document.getElementById('btnPdf').addEventListener('click', () => {
    // o PDF sempre sai com a lista completa
    if(buscaEl.value){ buscaEl.value = ''; desenhar(''); }
    const tituloOriginal = document.title;
    document.title = 'Ranking Truco AV 2026';   // vira o nome do arquivo PDF
    window.print();
    setTimeout(() => { document.title = tituloOriginal; }, 1000);
  });
  window.addEventListener('beforeprint', () => { if(buscaEl.value){ buscaEl.value=''; desenhar(''); } });

})();
</script>
</body>
</html>
